[package]
name = "meowsystem-status-hub"
version = "1.6.0"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-only"
description = "Bandeja: a StatusNotifierHost tray applet for COSMIC, dressed by MeowSystem"
repository = "https://github.com/vitoriamariadb/meowsystem-status-hub"
homepage = "https://github.com/vitoriamariadb/meowsystem-status-hub"
readme = "README.md"

[lib]
name = "cosmic_ext_applet_status_hub"
path = "src/lib.rs"

[[bin]]
name = "meowsystem-status-hub"
path = "src/main.rs"

[[bin]]
name = "meowsystem-status-hub-dump"
path = "src/bin/tray_dump.rs"

[features]
testkit = []

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
return_self_not_must_use = "allow"

[dependencies]
futures = "0.3"
cosmic-freedesktop-icons = { git = "https://github.com/pop-os/freedesktop-icons" }
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
image = { version = "0.25", default-features = false, features = ["png"] }
resvg = { version = "0.45", default-features = false }
i18n-embed-fl = "0.10"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "5.14", default-features = false, features = ["tokio"] }

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic"
default-features = false
features = [
    "applet",
    "applet-token",
    "dbus-config",
    "multi-window",
    "tokio",
    "wayland",
    "winit",
]

[dev-dependencies]
meowsystem-status-hub = { path = ".", features = ["testkit"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process"] }

[profile.release]
lto = "thin"
opt-level = 2
