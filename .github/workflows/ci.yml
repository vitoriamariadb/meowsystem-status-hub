name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libxkbcommon-dev \
            libwayland-dev \
            libfontconfig-dev \
            libexpat1-dev \
            libfreetype6-dev \
            dbus

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --features testkit

  metadata:
    name: Validate metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils appstream

      - name: Validate desktop entry
        run: |
          APPID=io.github.meowsystem.Bandeja
          output="$(desktop-file-validate "resources/${APPID}.desktop" || true)"
          output="$(printf '%s\n' "${output}" \
            | grep -v 'unregistered value "COSMIC"' \
            | grep -v 'does not contain a registered main category' \
            | grep -v '^$' || true)"
          if [ -n "${output}" ]; then printf '%s\n' "${output}"; exit 1; fi
          echo "desktop entry ok"

      - name: Validate AppStream metainfo
        run: |
          APPID=io.github.meowsystem.Bandeja
          appstreamcli validate --no-net "resources/${APPID}.metainfo.xml"
